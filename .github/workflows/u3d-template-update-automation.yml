# .github/workflows/u3d-template-update-automation.yml
# Automated Update Package Generation for Unreality3D Platform Developers
# 
# Runs when template changes are pushed to main branch
# Creates both full template ZIP and selective update .unitypackage
# Integrates with existing infrastructure and chunking system

name: U3D Template Update Automation

on:
  # Trigger on template changes
  push:
    branches: [main]
    paths:
      - 'Assets/U3D/**'
      - 'Assets/U3D_SDK/**' 
      - 'Assets/Plugins/**'
      - 'Assets/StreamingAssets/U3D/**'
      - 'ProjectSettings/**'
      - '.github/workflows/**'
  
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      create_full_release:
        description: 'Create full GitHub release with assets'
        required: false
        default: true
        type: boolean
      version_tag:
        description: 'Version tag (auto-generated if empty)'
        required: false
        type: string
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string

# Same permissions as existing chunking system
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-template-assets:
    name: Generate Template Distribution Assets
    runs-on: ubuntu-latest
    
    outputs:
      version_tag: ${{ steps.version.outputs.tag }}
      has_unity_changes: ${{ steps.changes.outputs.has_changes }}
      
    steps:
      - name: Checkout u3d-template repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version detection
          lfs: true

      - name: Detect template changes
        id: changes
        run: |
          echo "🔍 Analyzing changes in last commit..."
          
          # Check if this push contains Unity-related changes
          unity_changes=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E "(Assets/U3D|Assets/Plugins|ProjectSettings)" || true)
          
          if [ -n "$unity_changes" ]; then
            echo "✅ Unity template changes detected:"
            echo "$unity_changes"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No Unity template changes detected - skipping package generation"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate version tag
        id: version
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            VERSION_TAG="${{ github.event.inputs.version_tag }}"
          else
            # Auto-generate version: u3d-template-YYYY.MM.DD-HASH
            DATE=$(date +%Y.%m.%d)
            SHORT_HASH=$(git rev-parse --short HEAD)
            VERSION_TAG="u3d-template-${DATE}-${SHORT_HASH}"
          fi
          
          echo "📋 Generated version tag: $VERSION_TAG"
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      # Cache Unity Library for faster builds
      - name: Cache Unity Library
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-u3d-template-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-u3d-template-

      # Setup Unity for package export
      - name: Setup Unity Editor
        if: steps.changes.outputs.has_changes == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto  # Uses ProjectVersion.txt
          buildMethod: U3D.Editor.Tools.TemplatePackageExporter.ExportUpdatePackageCommandLine
          customParameters: -packageVersion ${{ steps.version.outputs.tag }}

      # Generate full template ZIP (clean version for new users)
      - name: Create full template ZIP
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "📦 Creating clean template ZIP for new users..."
          
          # Create clean copy excluding development artifacts
          mkdir -p dist/full-template
          
          # Copy essential template files
          cp -r Assets dist/full-template/
          cp -r Packages dist/full-template/
          cp -r ProjectSettings dist/full-template/
          cp .gitignore dist/full-template/
          cp README.md dist/full-template/
          
          # Copy GitHub workflows (important for chunking support)
          mkdir -p dist/full-template/.github
          cp -r .github/workflows dist/full-template/.github/
          
          # Remove development-specific files
          find dist/full-template -name "*.tmp" -delete
          find dist/full-template -name ".DS_Store" -delete
          
          # Create ZIP
          cd dist/full-template
          zip -r "../u3d-template-${{ steps.version.outputs.tag }}.zip" .
          cd ../..
          
          echo "✅ Full template ZIP created"

      # Verify generated assets
      - name: Verify generated assets
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "🔍 Verifying generated assets..."
          
          if [ -f "Build/Updates/u3d-template-update-${{ steps.version.outputs.tag }}.unitypackage" ]; then
            size=$(stat -f%z "Build/Updates/u3d-template-update-${{ steps.version.outputs.tag }}.unitypackage" 2>/dev/null || stat -c%s "Build/Updates/u3d-template-update-${{ steps.version.outputs.tag }}.unitypackage")
            echo "✅ Update package: $(($size / 1024 / 1024))MB"
          else
            echo "❌ Update package not found!"
            exit 1
          fi
          
          if [ -f "dist/u3d-template-${{ steps.version.outputs.tag }}.zip" ]; then
            size=$(stat -f%z "dist/u3d-template-${{ steps.version.outputs.tag }}.zip" 2>/dev/null || stat -c%s "dist/u3d-template-${{ steps.version.outputs.tag }}.zip")
            echo "✅ Full template ZIP: $(($size / 1024 / 1024))MB"
          else
            echo "❌ Full template ZIP not found!"
            exit 1
          fi

      # Upload artifacts for release
      - name: Upload template assets
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: u3d-template-${{ steps.version.outputs.tag }}
          path: |
            Build/Updates/*.unitypackage
            dist/*.zip
          retention-days: 90

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: generate-template-assets
    if: needs.generate-template-assets.outputs.has_unity_changes == 'true' && (github.event.inputs.create_full_release != 'false')
    
    steps:
      - name: Download template assets
        uses: actions/download-artifact@v4
        with:
          name: u3d-template-${{ needs.generate-template-assets.outputs.version_tag }}
          path: release-assets

      - name: Generate release notes
        id: release_notes
        run: |
          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            echo "notes=${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
          else
            # Auto-generate release notes
            cat > release_notes.md << 'EOF'
          # U3D Template Update - ${{ needs.generate-template-assets.outputs.version_tag }}
          
          This automated release contains updates to the Unreality3D Unity template.
          
          ## 📦 What's Included
          
          - **Update Package** (`u3d-template-update-*.unitypackage`): For existing users to update their projects
          - **Full Template** (`u3d-template-*.zip`): Complete template for new users
          
          ## 🔄 How to Update Existing Projects
          
          1. **Backup your project** first
          2. Download the `.unitypackage` file below
          3. In Unity: `Assets → Import Package → Custom Package`
          4. Select the downloaded `.unitypackage`
          5. **IMPORTANT**: Uncheck any files you've customized (scenes, materials, etc.)
          6. Click Import
          
          ## 🆕 New Users
          
          Download the full template ZIP and follow the setup guide at [unreality3d.com/docs](https://unreality3d.com/docs)
          
          ---
          
          Generated automatically from commit: ${{ github.sha }}
          EOF
          
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            cat release_notes.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.generate-template-assets.outputs.version_tag }}
          name: "U3D Template Update - ${{ needs.generate-template-assets.outputs.version_tag }}"
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            release-assets/Build/Updates/*.unitypackage
            release-assets/dist/*.zip
          draft: false
          prerelease: false

      - name: Update latest template link
        run: |
          echo "🔗 Template assets available at:"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.generate-template-assets.outputs.version_tag }}"
          echo ""
          echo "Direct download links:"
          echo "- Update Package: https://github.com/${{ github.repository }}/releases/download/${{ needs.generate-template-assets.outputs.version_tag }}/u3d-template-update-${{ needs.generate-template-assets.outputs.version_tag }}.unitypackage"
          echo "- Full Template: https://github.com/${{ github.repository }}/releases/download/${{ needs.generate-template-assets.outputs.version_tag }}/u3d-template-${{ needs.generate-template-assets.outputs.version_tag }}.zip"